<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Grêmio Conecta Jovem — Login</title>
 <link rel="manifest" href="manifest.json">
 <meta name="theme-color" content="#00E5FF">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <script src="assets/js/theme-runtime.js"></script>
 <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
</head>
<body class="login-page">

 <div class="watermark" style="position:fixed;top:10px;right:10px;font-size:0.7rem;color:var(--text-muted);opacity:0.5;pointer-events:none;">
 Grêmio Conecta Jovem — uso interno
 </div>

 <div class="login-wrapper">
    <div class="login-card fade-in">
      <div class="login-logo">
        <img src="assets/img/brand/crest-dark.png" alt="Grêmio Conecta Jovem" id="brand-crest">
      </div>

      <h2 class="login-title">🖐️ Acesso Grêmio</h2>
      <p class="login-subtitle">Insira seu código de acesso para entrar</p>

      <p class="login-slogan" style="font-size:0.8rem;color:var(--primary);letter-spacing:0.08em;margin:10px 0 18px;text-transform:uppercase;font-weight:600;">
        Educação com Participação é Transformação!
      </p>

      <form id="login-form" onsubmit="return validateLogin(event);">
        <div class="form-group">
          <label for="cpf">Código de Acesso</label>
          <input type="text" id="cpf" class="form-input" placeholder="Escreva seu código" required>
        </div>
        <div class="form-group">
          <label for="birth-date">Data de Nascimento</label>
          <input type="date" id="birth-date" class="form-input" required>
        </div>
        <button type="submit" id="btn-login" class="btn btn-primary" style="width:100%;">Entrar</button>
      </form>

      <div id="login-error" class="login-error">
        Dados incorretos. Tente novamente.
      </div>
    </div>
  </div>

  <div class="members-footer">
    <h3>Membros da Gestão</h3>
    <div class="members-grid-mini"></div>
  </div>

 <script src="assets/js/auth.js"></script>
 <script src="assets/js/app-banner.js"></script>
 <script>
 if ('serviceWorker' in navigator) {
 navigator.serviceWorker.register('sw.js').then(() => console.log('✅ SW registered'));
 }
 </script>
</body>
</html>
