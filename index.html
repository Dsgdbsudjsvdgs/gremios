<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grêmio Estudantil - Login</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: radial-gradient(circle at top right, #1a1c2c, var(--bg-dark));
            margin: 0;
            font-family: var(--font-main, 'Poppins', sans-serif);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-card {
            width: min(400px, 100%);
            text-align: center;
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--glass-shadow);
            box-sizing: border-box;
        }
        .logo-container {
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            box-shadow: 0 0 20px var(--primary);
        }
        .login-title {
            font-size: 1.8rem;
            margin-bottom: 10px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .login-subtitle {
            color: var(--text-dim);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            margin-left: 4px;
            transition: color 0.3s;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 98, 255, 0.2);
        }
        .input-group input.invalid {
            border-color: var(--error-color);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-md);
            border: none;
            background: var(--gradient-main);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 98, 255, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }
        .btn-login:active {
            transform: translateY(0);
            filter: brightness(0.9);
        }
        .btn-login:disabled {
            background: var(--text-dim);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }
        .error-msg {
            display: none;
            color: var(--error-color);
            margin-top: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 10px;
            border-radius: var(--radius-sm);
            background: rgba(255, 0, 0, 0.1);
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .watermark {
            position: fixed;
            top: 10px;
            right: 10px;
            font-size: 0.7rem;
            color: var(--text-dim);
            opacity: 0.5;
            pointer-events: none;
        }
        .members-footer {
            margin-top: auto;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .members-footer h3 {
            color: var(--text-dim);
            font-size: 1rem;
            font-weight: 500;
        }
        .members-grid-mini {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            width: 90%;
            max-width: 800px;
        }
    </style>
</head>
<body>
    <div class="watermark">Grêmio Estudantil — uso interno</div>
    
    <div class="login-wrapper">
        <div class="login-card fade-in">
            <div class="logo-container">
                <img src="assets/img/logo-da-escola/educa_mais_sem_fundo.svg" alt="Grêmio Logo">
            </div>
            
            <h2 class="login-title">🖐️ Acesso Grêmio</h2>
            <p class="login-subtitle">Insira seu código de acesso para entrar</p>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="cpf">Código de Acesso</label>
                    <input type="text" id="cpf" placeholder="Escreva seu código" required>
                </div>
                <div class="input-group">
                    <label for="birth-date">Data de Nascimento</label>
                    <input type="date" id="birth-date" required>
                </div>
                <button type="submit" id="btn-login" class="btn-login">Entrar</button>
            </form>
            
            <div id="login-error" class="error-msg">
                Dados incorretos. Tente novamente.
            </div>
        </div>
    </div>
    
    <div class="members-footer">
         <h3>Membros da Gestão</h3>
         <div class="members-grid-mini"></div>
    </div>
    
    <script src="assets/js/auth.js"></script>
</body>
</html>
