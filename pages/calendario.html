<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calendário | Grêmio Estudantil</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box h2 { color: var(--primary); margin-bottom: 16px; font-size: 1.1rem; }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .calendar-day {
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-main);
      min-height: 60px;
      position: relative;
    }
    .calendar-day:hover { background: rgba(0,229,255,0.1); }
    .calendar-day.other-month { color: var(--text-muted); opacity: 0.4; }
    .calendar-day.today { background: var(--primary); color: #000; font-weight: 700; border-radius: 50%; }
    .calendar-day.has-events { border: 2px solid var(--primary); }
    .calendar-day .event-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-top: 2px;
      margin-right: 2px;
    }
    .calendar-weekday { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; padding: 4px; }
    .event-item {
      padding: 12px;
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--glass-border);
      position: relative;
    }
    .event-item:hover { background: rgba(0,0,0,0.3); }
    .event-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .event-title { font-size: 0.9rem; font-weight: 700; color: var(--text-main); flex: 1; }
    .event-time { font-size: 0.75rem; color: var(--primary); font-weight: 600; white-space: nowrap; margin-left: 8px; }
    .event-category {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .event-location { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .event-description { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }
    .event-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--glass-border); }
    .btn-edit, .btn-delete {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      transition: var(--transition);
    }
    .btn-edit { background: rgba(0,229,255,0.1); color: var(--primary); }
    .btn-edit:hover { background: rgba(0,229,255,0.2); }
    .btn-delete { background: rgba(255,75,75,0.1); color: var(--danger); }
    .btn-delete:hover { background: rgba(255,75,75,0.2); }
    .search-bar { position: relative; margin-bottom: 16px; }
    .search-bar input { width: 100%; padding: 12px 14px 12px 40px; border-radius: var(--radius-md); border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: var(--text-main); font-size: 0.95rem; }
    .search-bar i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .filter-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-row select { padding: 8px 12px; border-radius: 8px; background: rgba(0,0,0,0.3); color: var(--text-main); border: 1px solid var(--glass-border); font-size: 0.85rem; flex: 1; min-width: 140px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-main); font-weight: 500; }
    .form-input { width: 100%; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: var(--text-main); font-size: 0.95rem; }
    .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,229,255,0.1); }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .time-inputs { display: flex; gap: 8px; align-items: center; }
    .time-inputs .form-input { flex: 1; max-width: 100px; }
    .recurring-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .recurring-option {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      background: rgba(0,0,0,0.2);
      cursor: pointer;
      font-size: 0.8rem;
      transition: var(--transition);
    }
    .recurring-option:hover { background: rgba(0,229,255,0.1); border-color: var(--primary); }
    .recurring-option input { accent-color: var(--primary); }
    .recurring-option.selected { background: rgba(0,229,255,0.2); border-color: var(--primary); }
    .event-dots { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
    .view-toggle { display: flex; gap: 4px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: var(--radius-md); }
    .view-toggle button { padding: 8px 12px; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text-muted); font-size: 0.85rem; cursor: pointer; transition: var(--transition); }
    .view-toggle button.active { background: var(--primary); color: #000; }
    .stats-bar { display: flex; gap: 16px; margin-bottom: 16px; padding: 12px; background: rgba(0,229,255,0.05); border-radius: var(--radius-md); border: 1px solid rgba(0,229,255,0.1); }
    .stat-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-main); }
    .stat-item i { color: var(--primary); }
  </style>
</head>
<body>

  <main class="main-content">
    <div class="page-header">
      <h1>Calendário</h1>
      <div class="page-header-actions">
        <div class="view-toggle">
          <button id="view-month" class="active" title="Visualização mensal"><i class="fa-solid fa-calendar-days"></i></button>
          <button id="view-week" title="Visualização semanal"><i class="fa-solid fa-calendar-week"></i></button>
          <button id="view-list" title="Lista de eventos"><i class="fa-solid fa-list"></i></button>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-item"><i class="fa-solid fa-calendar-check"></i> <span id="stat-total">0</span> eventos totais</div>
      <div class="stat-item"><i class="fa-solid fa-clock"></i> <span id="stat-this-month">0</span> este mês</div>
      <div class="stat-item"><i class="fa-solid fa-star"></i> <span id="stat-recurring">0</span> recorrentes</div>
    </div>

    <!-- Navegação do mês -->
    <div class="glass-card flex-between mb-2" style="align-items:center;">
      <button id="btn-prev-month" class="btn btn-ghost btn-sm"><i class="fa-solid fa-chevron-left"></i></button>
      <h2 id="current-month" style="margin:0;color:var(--primary);font-size:1.1rem;"></h2>
      <button id="btn-next-month" class="btn btn-ghost btn-sm"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <!-- Calendário (mês) -->
    <div id="calendar-month-view" class="glass-card mb-2">
      <div class="calendar-grid">
        <div class="calendar-weekday">Dom</div>
        <div class="calendar-weekday">Seg</div>
        <div class="calendar-weekday">Ter</div>
        <div class="calendar-weekday">Qua</div>
        <div class="calendar-weekday">Qui</div>
        <div class="calendar-weekday">Sex</div>
        <div class="calendar-weekday">Sáb</div>
      </div>
      <div id="calendar-days" class="calendar-grid"></div>
    </div>

    <!-- Calendário (semana) -->
    <div id="calendar-week-view" class="glass-card mb-2" style="display:none;">
      <div id="week-header" class="calendar-grid" style="margin-bottom:8px;"></div>
      <div id="week-days" class="calendar-grid" style="min-height:300px;"></div>
    </div>

    <!-- Lista de eventos -->
    <div id="calendar-list-view" class="glass-card mb-2" style="display:none;">
      <div class="filter-row">
        <input type="text" id="search-events" class="form-input" placeholder="Buscar eventos..." style="flex:1;">
        <select id="filter-category" class="form-input" style="min-width:160px;">
          <option value="">Todas categorias</option>
          <option value="reuniao">Reunião</option>
          <option value="evento">Evento</option>
          <option value="prazo">Prazo</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div id="events-list"></div>
    </div>

    <!-- Eventos do dia selecionado -->
    <div class="glass-card">
      <div class="flex-between mb-1">
        <h3 style="margin:0;color:var(--primary);font-size:1rem;"><i class="fa-solid fa-calendar-day"></i> Eventos do Dia <span id="selected-date-label" style="font-weight:400;color:var(--text-muted);font-size:0.85rem;"></span></h3>
        <button id="btn-add-event" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Novo Evento</button>
      </div>
      <div id="day-events">
        <p class="empty-state">Selecione um dia para ver os eventos</p>
      </div>
    </div>

    <!-- Modal Novo/Editar Evento -->
    <div id="event-modal" class="modal-overlay">
      <div class="modal-box">
        <h2 id="modal-title"><i class="fa-solid fa-calendar-plus"></i> Novo Evento</h2>
        <form id="event-form">
          <input type="hidden" name="event-id" id="event-id">
          <div class="form-group">
            <label>Nome do Evento *</label>
            <input type="text" name="event-title" class="form-input" placeholder="Ex: Reunião de planejamento" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Data *</label>
              <input type="date" name="event-date" class="form-input" required>
            </div>
            <div class="form-group">
              <label>Categoria</label>
              <select name="event-category" class="form-input">
                <option value="reuniao">Reunião</option>
                <option value="evento">Evento</option>
                <option value="prazo">Prazo</option>
                <option value="outro">Outro</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Hora Início</label>
              <input type="time" name="event-time-start" class="form-input">
            </div>
            <div class="form-group">
              <label>Hora Fim</label>
              <input type="time" name="event-time-end" class="form-input">
            </div>
          </div>
          <div class="form-group">
            <label>Local</label>
            <input type="text" name="event-location" class="form-input" placeholder="Ex: Sala 200, Auditório, Online">
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <textarea name="event-desc" class="form-input" rows="3" placeholder="Detalhes do evento..."></textarea>
          </div>
          <div class="form-group">
            <label>Repetir</label>
            <div class="recurring-options">
              <label class="recurring-option" data-value="none"><input type="radio" name="recurring" value="none" checked> Não repetir</label>
              <label class="recurring-option" data-value="daily"><input type="radio" name="recurring" value="daily"> Diariamente</label>
              <label class="recurring-option" data-value="weekly"><input type="radio" name="recurring" value="weekly"> Semanalmente</label>
              <label class="recurring-option" data-value="monthly"><input type="radio" name="recurring" value="monthly"> Mensalmente</label>
            </div>
          </div>
          <div style="display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary" style="flex:1;" id="btn-submit-event">Criar Evento</button>
            <button type="button" id="btn-close-modal" class="btn btn-ghost">Cancelar</button>
            <button type="button" id="btn-delete-event" class="btn btn-delete" style="display:none;">Excluir</button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/logout.js"></script>
  <script src="../assets/js/nav-component.js"></script>
  <script src="../assets/js/theme-manager.js"></script>
  <script src="../assets/js/core-guard.js"></script>
  <script src="../assets/js/calendar.js"></script>
</body>
</html>
