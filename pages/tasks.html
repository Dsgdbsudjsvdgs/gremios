<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão de Tarefas | Grêmio Estudantil</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="side-nav">
        <div class="logo-container">
            <div class="mobile-nav-trigger">
                <div class="logo-pulse-btn">
                    <img src="../assets/img/logo-da-escola/file_000000000d1871f59dac366c408947b5.svg" alt="Logo Escola">
                </div>
            </div>
        </div>
            </div>
        </div
        <ul class="nav-links">
            <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="fa-solid fa-house"></i> Dashboard</a></li>
            <li class="nav-item"><a href="diretoria.html" class="nav-link"><i class="fa-solid fa-users"></i> Diretoria</a></li>
            <li class="nav-item"><a href="calendario.html" class="nav-link"><i class="fa-solid fa-calendar-days"></i> Calendário</a></li>
            <li class="nav-item"><a href="diario.html" class="nav-link"><i class="fa-solid fa-book"></i> Diário/Notas</a></li>
            <li class="nav-item"><a href="perfil.html" class="nav-link"><i class="fa-solid fa-user"></i> Meu Perfil</a></li>
            <li class="nav-item"><a href="../index.html" class="nav-link" style="color: var(--danger);"><i class="fa-solid fa-right-from-bracket"></i> Sair</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <h1>📋 Gestão de Tarefas</h1>
            <button id="btn-add-task" class="btn-primary"><i class="fa-solid fa-plus"></i> Nova Tarefa</button>
        </header>

        <div class="glass-card" style="margin-bottom: 30px;">
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <label>Filtrar por Departamento:</label>
                <select id="filter-dept" style="width: auto; flex-grow: 1; max-width: 300px;">
                    <option value="all">Todas as Áreas</option>
                </select>
            </div>
        </div>

        <div id="tasks-grid" class="diary-grid">
            <!-- Tarefas injetadas via JS -->
        </div>
    </main>

    <!-- Modal Nova Tarefa -->
    <div id="task-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); align-items: center; justify-content: center; z-index: 1000;">
        <div class="glass-card" style="width: 500px; max-width: 90%;">
            <h2>Nova Tarefa</h2>
            <form id="task-form">
                <label>Título da Tarefa</label>
                <input type="text" name="title" required placeholder="Ex: Organizar reunião de pauta">
                
                <label>Descrição</label>
                <textarea name="description" rows="3" placeholder="Detalhes da tarefa..."></textarea>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Prioridade</label>
                        <select name="priority">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>
                    <div>
                        <label>Data de Entrega</label>
                        <input type="date" name="due_date">
                    </div>
                </div>

                <label>Departamento</label>
                <select name="department_id" id="dept-select">
                    <!-- Preenchido via JS -->
                </select>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" id="btn-close-task-modal" class="btn-outline" style="flex: 1;">Cancelar</button>
                    <button type="submit" class="btn-primary" style="flex: 1;">Salvar Tarefa</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/tasks_manager.js"></script>
    <script src="../assets/js/mobile-nav.js"></script>
</body>
</html>
