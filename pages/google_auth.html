<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Autenticação | Grêmio Estudantil</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card fade-in">
      <div class="login-logo">
        <img src="../assets/img/brand/crest-dark.png" alt="Grêmio Conecta Jovem">
      </div>
      <h2 class="login-title">Autenticação Google</h2>
      <p class="login-subtitle">Conectando com sua conta...</p>
      <p class="login-slogan" style="font-size:0.8rem;color:var(--primary);letter-spacing:0.08em;margin:10px 0 18px;text-transform:uppercase;font-weight:600;">
        Educação com Participação é Transformação!
      </p>
      <div id="auth-status" class="text-center mt-2">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:var(--primary);"></i>
      </div>
    </div>
  </div>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
</body>
</html>
