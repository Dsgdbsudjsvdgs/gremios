<!DOCTYPE html>
<html lang="pt-br">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Sobre o App | Grêmio Estudantil</title>
 <link rel="stylesheet" href="../assets/css/variables.css">
 <link rel="stylesheet" href="../assets/css/style.css">
 <style>
  .about-container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  .about-logo { text-align: center; margin-bottom: 24px; }
  .about-logo .logo-circle { width: 80px; height: 80px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 2rem; font-weight: 800; color: #000; }
  .about-logo h1 { font-size: 1.3rem; color: var(--text-main); }
  .about-logo p { font-size: 0.85rem; color: var(--text-muted); }
  .update-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 20px; margin: 20px 0; }
  .update-card h2 { font-size: 1rem; color: var(--primary); margin-bottom: 12px; }
  .version-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .version-label { font-size: 0.85rem; color: var(--text-muted); }
  .version-value { font-size: 0.95rem; color: var(--text-main); font-weight: 600; font-family: monospace; }
  #update-status { font-size: 0.85rem; margin: 8px 0; }
  #update-btn { display: none; padding: 10px 24px; border-radius: 20px; background: var(--primary); color: #000; font-weight: 700; font-size: 0.9rem; border: none; cursor: pointer; margin-top: 8px; }
  #update-btn:hover { opacity: 0.9; }
  .changelog-box { display: none; margin-top: 16px; }
  .changelog-box h3 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
  .changelog-box ul { list-style: none; padding: 0; }
  .changelog-box ul li { font-size: 0.85rem; color: var(--text-main); padding: 4px 0; border-bottom: 1px solid var(--glass-border); }
  .changelog-box ul li:last-child { border: none; }
  .changelog-box ul li::before { content: '✦ '; color: var(--primary); }
  .info-section { margin-top: 24px; }
  .info-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--glass-border); }
  .info-item .label { font-size: 0.85rem; color: var(--text-muted); }
  .info-item .value { font-size: 0.85rem; color: var(--text-main); }
  .check-btn { padding: 8px 20px; border-radius: 16px; background: rgba(0,229,255,0.1); color: var(--primary); border: 1px solid var(--glass-border); font-size: 0.85rem; cursor: pointer; margin-top: 4px; }
  .check-btn:hover { background: rgba(0,229,255,0.2); }
 </style>
</head>
<body>
 <main class="main-content">
  <div class="about-container">
   <div class="about-logo">
    <div class="logo-circle">G</div>
    <h1>Grêmio Estudantil</h1>
    <p id="version-display">Carregando...</p>
   </div>

   <div class="update-card">
    <h2>🔄 Atualizações</h2>
    <div class="version-row">
     <span class="version-label">Versão instalada</span>
     <span class="version-value" id="installed-version">—</span>
    </div>
    <div id="update-status">—</div>
    <button id="update-btn">⬇ Baixar Atualização</button>
    <button class="check-btn" onclick="checkForUpdates()">Verificar agora</button>
    <div class="changelog-box">
     <h3>Novidades:</h3>
     <ul id="changelog"></ul>
    </div>
   </div>

   <div class="info-section">
    <div class="info-item">
     <span class="label">Desenvolvedor</span>
     <span class="value">Dir. Tecnologia — Elvey</span>
    </div>
    <div class="info-item">
     <span class="label">Backend</span>
     <span class="value">Supabase</span>
    </div>
    <div class="info-item">
     <span class="label">Plataforma</span>
     <span class="value">Android (WebView)</span>
    </div>
    <div class="info-item">
     <span class="label">Repo</span>
     <span class="value" style="color:var(--primary)">GitHub</span>
    </div>
   </div>
  </div>
 </main>

 <script src="../assets/js/config.js"></script>
 <script src="../assets/js/utils.js"></script>
 <script src="../assets/js/update.js"></script>
 <script>
  document.getElementById('installed-version').textContent = `v${UPDATE_CONFIG.CURRENT_VERSION} (${UPDATE_CONFIG.CURRENT_BUILD})`;
  checkForUpdates();
 </script>
</body>
</html>
