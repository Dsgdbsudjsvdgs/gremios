<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Perfil | Grêmio Estudantil</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
<body>
    <nav class="side-nav">
        <div class="logo-container">
            <div class="mobile-nav-trigger">
                <div class="logo-pulse-btn">
                    <img src="../assets/img/logo-da-escola/file_000000000d1871f59dac366c408947b5.svg" alt="Logo Escola">
                </div>
            </div>
        </div>
        <ul class="nav-links">
            <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="fa-solid fa-house"></i> Dashboard</a></li>
            <li class="nav-item"><a href="diretoria.html" class="nav-link"><i class="fa-solid fa-users"></i> Diretoria</a></li>
            <li class="nav-item"><a href="calendario.html" class="nav-link"><i class="fa-solid fa-calendar-days"></i> Calendário</a></li>
            <li class="nav-item"><a href="diario.html" class="nav-link"><i class="fa-solid fa-book"></i> Diário/Notas</a></li>
            <li class="nav-item"><a href="perfil.html" class="nav-link active"><i class="fa-solid fa-user"></i> Meu Perfil</a></li>
            <li class="nav-item"><a href="../index.html" class="nav-link" style="color: var(--danger);"><i class="fa-solid fa-right-from-bracket"></i> Sair</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <h1>Meu Perfil</h1>
            <div id="user-status" class="role-badge" style="background: white; color: black;">Autenticado</div>
        </header>

        <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
            <div style="text-align: center; margin-bottom: 30px;">
                <div id="profile-pic" style="width: 100px; height: 100px; background: white; color: black; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; margin: 0 auto 15px auto; overflow: hidden;">
                    U
                </div>
                <h2 id="profile-name" style="margin: 0;">Carregando...</h2>
                <span id="profile-role" class="role-badge">Cargo</span>
            </div>

            <form id="profile-form">
                <label>Nome Completo</label>
                <input type="text" id="edit-name" placeholder="Seu nome aqui...">
                
                <label>Cor do Perfil</label>
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
                    <input type="color" id="edit-color" style="width: 50px; padding: 0; height: 40px; cursor: pointer;">
                    <input type="text" id="edit-color-hex" placeholder="#FFFFFF" style="margin-bottom: 0;">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">Salvar Alterações</button>
            </form>
        </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/profile.js"></script>
</body>
</html>
