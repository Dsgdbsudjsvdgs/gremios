<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meu Perfil | Grêmio Estudantil</title>
  <script src="../assets/js/theme-runtime.js"></script>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../assets/css/dash.css">
  <style>
    .profile-wrap { max-width: 480px; margin: 0 auto; }

    /* ---- Capa + avatar ---- */
    .profile-hero {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 54px;
      border: 1px solid var(--glass-border);
    }
    .profile-cover {
      height: 110px;
      background: linear-gradient(135deg, var(--accent-color, #8f1212) 0%, rgba(0,0,0,0.55) 100%);
      position: relative;
    }
    .profile-cover::after {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.18) 0%, transparent 45%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 12px);
    }
    .profile-avatar-lg {
      position: absolute; left: 50%; bottom: -42px; transform: translateX(-50%);
      width: 92px; height: 92px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; font-weight: 800;
      background: #111; color: var(--accent-color, #8f1212);
      border: 4px solid var(--bg-surface);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      overflow: hidden; cursor: pointer;
      transition: box-shadow 0.2s;
    }
    .profile-avatar-lg:hover { box-shadow: 0 0 0 3px var(--accent-color, #8f1212); }
    .profile-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-edit-hint {
      position: absolute; inset: 0; border-radius: 50%;
      background: rgba(0,0,0,0.55); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; opacity: 0; transition: opacity 0.2s;
    }
    .profile-avatar-lg:hover .avatar-edit-hint { opacity: 1; }
    .avatar-ring {
      position: absolute; inset: -8px; border-radius: 50%;
      border: 2px solid var(--accent-color, #8f1212); opacity: 0.35;
      animation: none;
    }

    /* ---- Identidade ---- */
    .profile-id { text-align: center; }
    .profile-id h2 { margin: 0 0 6px; font-size: 1.3rem; color: var(--text-main); }
    .profile-role-row { display: flex; justify-content: center; margin-bottom: 10px; }
    #profile-role {
      display: inline-block; padding: 5px 16px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.4px;
      background: rgba(143, 18, 18, 0.12); color: var(--accent-color, #8f1212);
      border: 1px solid var(--accent-color, #8f1212);
    }
    #profile-bio {
      margin: 0 auto 0; max-width: 340px; font-size: 0.85rem;
      color: var(--text-muted); line-height: 1.45; font-style: italic;
    }
    #profile-bio:empty { display: none; }

    /* ---- Form ---- */
    .profile-form-card { margin-top: 18px; padding: 18px 16px; }
    .profile-form-card h3 {
      margin: 0 0 14px; font-size: 0.8rem; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
    .form-input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--glass-border); background: rgba(0,0,0,0.25);
      color: var(--text-main); font-size: 0.9rem; outline: none; box-sizing: border-box;
    }
    .form-input:focus { border-color: var(--accent-color, #8f1212); }

    /* ---- Paleta de cores ---- */
    .palette-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 10px; }
    .palette-swatch {
      aspect-ratio: 1; border-radius: 10px; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s;
      position: relative;
    }
    .palette-swatch:active { transform: scale(0.9); }
    .palette-swatch.selected { border-color: #fff; box-shadow: 0 0 0 2px var(--accent-color, #8f1212); }
    .palette-swatch.selected::after {
      content: '✓'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 0.9rem;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    .custom-color-row { display: flex; gap: 8px; align-items: center; }
    .custom-color-row input[type="color"] { width: 44px; height: 38px; border: none; border-radius: 8px; cursor: pointer; background: none; }
    .custom-color-row input[type="text"] { flex: 1; }

    /* ---- Bio counter ---- */
    .bio-row { position: relative; }
    .bio-row textarea { resize: vertical; min-height: 70px; }
    .bio-counter {
      position: absolute; right: 10px; bottom: 8px;
      font-size: 0.65rem; color: var(--text-muted);
    }

    .btn-primary {
      background: var(--accent-color, #8f1212); color: #000; border: none;
      font-weight: 700; cursor: pointer; transition: transform 0.15s, opacity 0.2s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }

    #avatar-file { display: none; }

    .profile-stats { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
    .pstat { text-align: center; }
    .pstat b { display: block; font-size: 1.15rem; color: var(--accent-color, #8f1212); }
    .pstat span { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* ═══ SEÇÃO APARÊNCIA (tema do app) ═══ */
    .theme-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .theme-preset {
      border: 2px solid var(--glass-border); border-radius: 14px; padding: 10px 6px;
      cursor: pointer; text-align: center; background: transparent; color: var(--text-main);
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.4px; transition: var(--transition);
    }
    .theme-preset .sw { display: flex; gap: 4px; justify-content: center; margin-bottom: 7px; }
    .theme-preset .sw i { width: 16px; height: 16px; border-radius: 5px; display: block; border: 1px solid rgba(255,255,255,0.15); }
    .theme-preset.sel { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(143,18,18,0.18); }
    .theme-ctrl { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--glass-border); }
    .theme-ctrl:last-child { border-bottom: none; }
    .theme-ctrl label { flex: 1; font-size: 0.82rem; }
    .theme-ctrl label small { display: block; color: var(--text-muted); font-size: 0.64rem; margin-top: 2px; }
    .theme-ctrl input[type=color] { width: 44px; height: 34px; border: 1px solid var(--glass-border); border-radius: 10px; background: transparent; padding: 2px; cursor: pointer; }
    .theme-ctrl .tval { font-size: 0.64rem; color: var(--text-dim); font-family: monospace; width: 60px; text-align: right; }
    .theme-preview {
      margin: 14px 0 4px; padding: 14px;
      border-radius: 18px; border: 1px solid var(--glass-border);
      background: var(--bg-dark, #0a0505);
    }
    .theme-preview .tpv-hero { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; font-weight: 700; }
    .theme-preview .tpv-hero small { color: var(--text-muted); font-weight: 400; }
    .theme-preview .tpv-logo {
      width: 36px; height: 36px; border-radius: 10px; font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--text-main); display: flex; align-items: center; justify-content: center;
    }
    .theme-preview .tpv-chip {
      display: inline-block; margin: 10px 0 0; padding: 4px 10px; font-size: 0.58rem; font-weight: 800;
      background: var(--bg-surface); color: var(--accent); border: 1px solid var(--primary); border-radius: 999px;
    }
    .theme-preview .tpv-btn {
      display: inline-block; margin: 8px 0 0; padding: 6px 16px; font-size: 0.68rem; font-weight: 800;
      background: var(--primary); color: var(--text-main); border-radius: 999px;
    }
    .theme-btns { display: flex; gap: 10px; margin-top: 14px; }
    .theme-btns .btn { flex: 1; padding: 11px; border-radius: 999px; border: none; font-size: 0.78rem; font-weight: 800; cursor: pointer; }
    .theme-btns .btn-save-t { background: var(--primary); color: var(--text-main); }
    .theme-btns .btn-reset-t { background: var(--bg-surface-hover); color: var(--text-main); border: 1px solid var(--glass-border); }
  </style>
</head>
<body>

  <main class="main-content">
    <div class="profile-wrap">

      <!-- Hero: capa + avatar -->
      <div class="profile-hero glass-card" style="padding:0;">
        <div class="profile-cover" id="profile-cover"></div>
        <div class="profile-avatar-lg" id="profile-pic" title="Trocar foto">
          <span id="avatar-letter">U</span>
          <div class="avatar-edit-hint"><i class="fa-solid fa-camera"></i></div>
        </div>
        <input type="file" id="avatar-file" accept="image/*">
      </div>

      <!-- Identidade -->
      <div class="profile-id">
        <h2 id="profile-name">Usuário</h2>
        <div class="profile-role-row"><span id="profile-role">Membro</span></div>
        <p id="profile-bio"></p>
      </div>

      <!-- Edição -->
      <div class="glass-card profile-form-card">
        <h3><i class="fa-solid fa-sliders"></i> Dados & Identidade</h3>
        <form id="profile-form">
          <div class="form-group">
            <label>Nome</label>
            <input type="text" id="edit-name" name="edit-name" class="form-input" maxlength="60">
          </div>

          <div class="form-group">
            <label>Bio</label>
            <div class="bio-row">
              <textarea id="edit-bio" class="form-input" maxlength="140" placeholder="Uma frase sobre você (aparece no seu perfil)"></textarea>
              <span class="bio-counter"><span id="bio-count">0</span>/140</span>
            </div>
          </div>

          <div class="form-group">
            <label>Cor da sua capa <small style="color:var(--text-muted);font-weight:400;">(sua identidade no perfil — não muda o app)</small></label>
            <div class="palette-grid" id="palette-grid"></div>
            <div class="custom-color-row">
              <input type="color" id="edit-color" title="Cor personalizada">
              <input type="text" id="edit-color-hex" class="form-input" placeholder="#8f1212">
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px;padding:12px;">Salvar Alterações</button>
        </form>
      </div>

      <!-- ═══ Aparência: tema do app ═══ -->
      <div class="glass-card profile-form-card">
        <h3><i class="fa-solid fa-palette"></i> Aparência do app</h3>
        <div class="theme-presets" id="theme-presets"></div>
        <div id="theme-controls"></div>
        <div class="theme-preview" id="theme-preview">
          <div class="tpv-hero"><div class="tpv-logo">G</div><div>Grêmio Conecta Jovem<br><small>preview do tema</small></div></div>
          <span class="tpv-chip">MEMBRO ATIVO</span>
          <span class="tpv-btn">Participar</span>
        </div>
        <div class="theme-btns">
          <button type="button" class="btn btn-reset-t" id="theme-reset">Restaurar padrão</button>
          <button type="button" class="btn btn-save-t" id="theme-save">Salvar tema</button>
        </div>
        <p style="font-size:0.66rem;color:var(--text-muted);margin-top:10px;" id="theme-hint">Aplicado em todas as páginas do app e sincronizado com sua conta.</p>
      </div>

    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/logout.js"></script>
	<script src="../assets/js/nav-component.js"></script>
  <script src="../assets/js/theme-manager.js"></script>
  <script src="../assets/js/core-guard.js"></script>
  <script src="../assets/js/profile.js"></script>
  <script src="../assets/js/appearance.js"></script>
</body>
</html>
