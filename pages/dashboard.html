<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard | Grêmio Estudantil</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Nav injetada via nav-component.js -->

  <main class="main-content">
    <div class="page-header">
      <h1>Dashboard</h1>
      <div class="page-header-actions">
        <div id="user-avatar" class="role-badge" style="width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,229,255,0.15);border:1px solid var(--primary);color:var(--primary);font-weight:700;">U</div>
      </div>
    </div>

    <!-- Welcome -->
    <div class="glass-card glass-card-accent mb-2">
      <h2 style="margin:0;font-size:1.1rem;color:var(--primary);">Bem-vindo, <span id="user-name">Usuário</span>!</h2>
      <p style="margin:4px 0 0;color:var(--text-muted);font-size:0.85rem;">Cargo: <span id="user-role">Membro</span></p>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="glass-card stat-card">
        <i class="fa-solid fa-list-check stat-icon"></i>
        <div id="pending-tasks-count" class="stat-value">0</div>
        <div class="stat-label">Tarefas Pendentes</div>
      </div>
      <div class="glass-card stat-card">
        <i class="fa-solid fa-calendar-day stat-icon"></i>
        <div id="upcoming-events-count" class="stat-value">0</div>
        <div class="stat-label">Eventos Hoje</div>
      </div>
      <div class="glass-card stat-card">
        <i class="fa-solid fa-users stat-icon"></i>
        <div id="members-count" class="stat-value">0</div>
        <div class="stat-label">Membros Totais</div>
      </div>
    </div>

    <!-- Content Grid -->
    <div class="content-grid">
      <div class="glass-card">
        <div class="flex-between mb-1">
          <h3 style="margin:0;color:var(--primary);font-size:1rem;"><i class="fa-solid fa-clock-rotate-left"></i> Recentes</h3>
          <a href="tasks.html" class="btn btn-outline btn-sm">Ver Todas</a>
        </div>
        <div id="recent-tasks">
          <p class="empty-state">Carregando tarefas...</p>
        </div>
      </div>
      <div class="glass-card">
        <div class="flex-between mb-1">
          <h3 style="margin:0;color:var(--primary);font-size:1rem;"><i class="fa-solid fa-star"></i> Agenda</h3>
          <a href="calendario.html" class="btn btn-outline btn-sm">Ver Tudo</a>
        </div>
        <div id="upcoming-events">
          <p class="empty-state">Carregando eventos...</p>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/logout.js"></script>
 <script src="../assets/js/nav-component.js"></script>
  <script src="../assets/js/theme-manager.js"></script>
  <script src="../assets/js/core-guard.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
