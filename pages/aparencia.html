<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aparência | Grêmio Conecta Jovem</title>
  <link rel="icon" href="../assets/img/brand/crest-icon-512.png" type="image/png">
  <script src="../assets/js/theme-runtime.js"></script>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark); color: var(--text-main);
      min-height: 100vh; padding-bottom: 100px;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 20px 18px; }

    .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .page-head img { width: 44px; height: 44px; border-radius: 12px; }
    .page-head h1 { font-size: 1.25rem; }
    .page-head p { font-size: 0.78rem; color: var(--text-muted); }

    .card {
      background: var(--bg-surface); border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px;
    }
    .card h2 { font-size: 0.72rem; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; }

    /* ── Presets ── */
    .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .preset {
      border: 2px solid var(--glass-border); border-radius: 16px; padding: 10px;
      cursor: pointer; text-align: center; background: transparent; color: var(--text-main);
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.4px;
      transition: var(--transition);
    }
    .preset .sw { display: flex; gap: 4px; justify-content: center; margin-bottom: 8px; }
    .preset .sw i { width: 18px; height: 18px; border-radius: 6px; display: block; }
    .preset.sel { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(143,18,18,0.18); }

    /* ── Controls ── */
    .ctrl { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--glass-border); }
    .ctrl:last-child { border-bottom: none; }
    .ctrl label { flex: 1; font-size: 0.86rem; }
    .ctrl label small { display: block; color: var(--text-muted); font-size: 0.66rem; margin-top: 2px; }
    .ctrl input[type=color] {
      width: 46px; height: 36px; border: 1px solid var(--glass-border);
      border-radius: 10px; background: transparent; padding: 2px; cursor: pointer;
    }
    .ctrl .val { font-size: 0.66rem; color: var(--text-dim); font-family: monospace; width: 62px; text-align: right; }

    /* ── Preview ── */
    #preview {
      border-radius: var(--radius-lg); overflow: hidden;
      border: 1px solid var(--glass-border);
      background: var(--bg-dark);
    }
    #preview .pv-hero { padding: 18px; display: flex; align-items: center; gap: 12px; }
    #preview .pv-logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--gradient-main); color: var(--text-main);
      display: flex; align-items: center; justify-content: center; font-weight: 900;
    }
    #preview .pv-chip {
      margin: 0 18px 14px; display: inline-block; padding: 5px 12px;
      background: rgba(143,18,18,0.2); color: var(--accent);
      border: 1px solid var(--primary); border-radius: 999px; font-size: 0.62rem; font-weight: 800;
    }
    #preview .pv-btn {
      display: inline-block; margin: 0 18px 18px; padding: 9px 20px;
      background: var(--primary); color: var(--text-main); border-radius: 999px;
      font-size: 0.75rem; font-weight: 800;
    }
    #preview .pv-bar { height: 7px; background: var(--bg-surface); margin: 0 18px 18px; border-radius: 999px; }
    #preview .pv-bar i { display: block; height: 100%; width: 42%; background: var(--gradient-main); border-radius: 999px; }

    .btns { display: flex; gap: 10px; margin-top: 4px; }
    .btn {
      flex: 1; padding: 13px; border-radius: 999px; border: none;
      font-size: 0.82rem; font-weight: 800; letter-spacing: 0.4px; cursor: pointer;
    }
    .btn.save { background: var(--primary); color: var(--text-main); }
    .btn.reset { background: var(--bg-surface-hover); color: var(--text-main); border: 1px solid var(--glass-border); }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--primary); color: var(--text-main); padding: 12px 22px;
      border-radius: 999px; font-size: 0.8rem; font-weight: 700;
      transition: transform 0.3s; z-index: 100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <img src="../assets/img/brand/crest-icon-512.png" alt="logo">
      <div>
        <h1>Aparência</h1>
        <p>Personalize as cores da interface do app</p>
      </div>
    </div>

    <div class="card">
      <h2>Temas prontos</h2>
      <div class="presets" id="presets"></div>
    </div>

    <div class="card">
      <h2>Preview ao vivo</h2>
      <div id="preview">
        <div class="pv-hero">
          <div class="pv-logo">G</div>
          <div>Grêmio Conecta Jovem<br><small style="color:var(--text-muted)">preview do tema</small></div>
        </div>
        <span class="pv-chip">MEMBRO ATIVO</span>
        <br>
        <span class="pv-btn">Participar</span>
        <div class="pv-bar"><i></i></div>
      </div>
    </div>

    <div class="card">
      <h2>Cores personalizadas</h2>
      <div id="controls"></div>
    </div>

    <div class="btns">
      <button class="btn reset" onclick="resetTheme()">Restaurar padrão</button>
      <button class="btn save" onclick="saveTheme()">Salvar tema</button>
    </div>
  </div>

  <div class="toast" id="toast">Tema salvo ✓</div>

  <script>
    // ═════════════════════════════════════════════════
    // PRESETS — Conecta 2026 padrão + alternativos
    // ═════════════════════════════════════════════════
    const PRESETS = {
      'conecta':  { label: 'CONECTA 2026', primary: '#8f1212', primaryDark: '#380808', bg: '#0a0505', accent: '#c88888', text: '#f6eade' },
      'coral':    { label: 'CORAL LOVABLE', primary: '#e04e2d', primaryDark: '#7a2e18', bg: '#1d1815', accent: '#e08d4e', text: '#f5efe9' },
      'ciano':    { label: 'EDUCA CYAN', primary: '#00E5FF', primaryDark: '#00B2CC', bg: '#000000', accent: '#FFFFFF', text: '#FFFFFF' },
      'roxo':     { label: 'NOTURNO', primary: '#8b5cf6', primaryDark: '#4c1d95', bg: '#0c0a14', accent: '#c4b5fd', text: '#f5f3ff' },
      'verde':    { label: 'MATA', primary: '#10b981', primaryDark: '#065f46', bg: '#06120c', accent: '#a7f3d0', text: '#f0fdf7' },
      'ambar':    { label: 'AMAZÔNIA', primary: '#f59e0b', primaryDark: '#92400e', bg: '#140d04', accent: '#fde68a', text: '#fffbeb' }
    };

    // Mapeamento custom -> variaveis CSS
    const CONTROLS = [
      { key: 'primary',     label: 'Cor principal',    hint: 'Botões, destaques, barra' },
      { key: 'primaryDark', label: 'Cor de profundidade', hint: 'Sombras, gradientes, detalhes' },
      { key: 'bg',          label: 'Fundo do app',      hint: 'Cor de base escura' },
      { key: 'accent',      label: 'Cor de apoio',       hint: 'Detalhes claros e tags' },
      { key: 'text',        label: 'Cor do texto',      hint: 'Texto principal do app' }
    ];

    const LS_KEY = 'gremio_theme_custom';
    let current = { primary: '#8f1212', primaryDark: '#380808', bg: '#0a0505', accent: '#c88888', text: '#f6eade' };
    let selectedPreset = 'conecta';

    // ── Init ──
    (function init() {
      const saved = localStorage.getItem(LS_KEY);
      if (saved) {
        try { current = JSON.parse(saved); selectedPreset = current.preset || 'conecta'; } catch (e) {}
      }
      renderPresets();
      renderControls();
      applyLive();
    })();

    function renderPresets() {
      const el = document.getElementById('presets');
      el.innerHTML = Object.entries(PRESETS).map(([id, p]) => `
        <button class="preset ${id === selectedPreset ? 'sel' : ''}" onclick="pickPreset('${id}')">
          <span class="sw">
            <i style="background:${p.bg}"></i><i style="background:${p.primary}"></i><i style="background:${p.accent}"></i>
          </span>${p.label}
        </button>`).join('');
    }

    function renderControls() {
      const el = document.getElementById('controls');
      el.innerHTML = CONTROLS.map(c => `
        <div class="ctrl">
          <label>${c.label}<small>${c.hint}</small></label>
          <span class="val" id="val-${c.key}">${current[c.key]}</span>
          <input type="color" id="in-${c.key}" value="${current[c.key]}" oninput="pickCustom('${c.key}', this.value)">
        </div>`).join('');
    }

    function pickPreset(id) {
      const p = PRESETS[id];
      selectedPreset = id;
      current = { primary: p.primary, primaryDark: p.primaryDark, bg: p.bg, accent: p.accent, text: p.text, preset: id };
      renderPresets(); renderControls(); applyLive();
    }

    function pickCustom(key, val) {
      selectedPreset = null;
      current[key] = val;
      current.preset = null;
      document.getElementById('val-' + key).textContent = val;
      renderPresets();
      applyLive();
    }

    function applyLive() {
      const r = document.documentElement.style;
      r.setProperty('--primary', current.primary);
      r.setProperty('--primary-dark', current.primaryDark);
      r.setProperty('--bg-dark', current.bg);
      r.setProperty('--accent', current.accent);
      r.setProperty('--text-main', current.text);
      r.setProperty('--gradient-main', `linear-gradient(135deg, ${current.primary}, ${current.primaryDark})`);
    }

    function saveTheme() {
      localStorage.setItem(LS_KEY, JSON.stringify(current));
      document.getElementById('toast').classList.add('show');
      setTimeout(() => document.getElementById('toast').classList.remove('show'), 1800);
    }

    function resetTheme() {
      localStorage.removeItem(LS_KEY);
      pickPreset('conecta');
      document.getElementById('toast').textContent = 'Tema restaurado';
      document.getElementById('toast').classList.add('show');
      setTimeout(() => { document.getElementById('toast').classList.remove('show'); document.getElementById('toast').textContent = 'Tema salvo ✓'; }, 1800);
    }
  </script>
</body>
</html>
